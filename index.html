
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blue Shift Employee Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Blue Shift Employee Registration</h1>

            <p class="subtitle">Enter your details below</p>

            <form action="insert.php" method="POST" onsubmit="return validateForm()">

                <div class="form-group">
                    <label for="employee_id">Employee ID</label>
                    <input type="text" id="employee_id" name="employee_id"
                        placeholder="Enter employee ID" required>
                </div>

                <div class="form-group">
                    <label for="employee_name">Employee Name</label>
                    <input type="text" id="employee_name" name="employee_name"
                        placeholder="Enter employee name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                        placeholder="Enter phone number"
                        pattern="[0-9]{10}" title="Enter a 10-digit phone number"
                        required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="MARKETING">MARKETING</option>
                        <option value="SALES">SALES</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" name="designation"
                        placeholder="Enter designation" required>
                </div>

                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" name="salary"
                        placeholder="Enter salary" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="joining_date">Joining Date</label>
                    <input type="date" id="joining_date" name="joining_date"
                        required>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">Submit</button>
                    <button type="reset" class="reset-btn">Clear</button>
                </div>

            </form>

        </div>

    </div>

    <script>
        function validateForm() {
            let empId = document.getElementById("employee_id").value.trim();
            let name = document.getElementById("employee_name").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let salary = document.getElementById("salary").value;

            if (empId === "" || name === "") {
                alert("Employee ID and Name cannot be empty.");
                return false;
            }

            if (!/^[0-9]{10}$/.test(phone)) {
                alert("Phone number must contain exactly 10 digits.");
                return false;
            }

            if (Number(salary) < 0) {
                alert("Salary cannot be negative.");
                return false;
            }

            return true;
        }
    </script>

</body>
</html>
